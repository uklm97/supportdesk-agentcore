[project]
name = "supportdesk"
version = "0.1.0"
description = "SupportDesk customer support agent on AWS (local Python code and tests)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "strands-agents>=1.0",
    "bedrock-agentcore>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "moto[dynamodb]>=5.0",
]

[tool.pytest.ini_options]
pythonpath = ["lambdas/orders", "app/supportdesk"]
testpaths = ["tests"]
