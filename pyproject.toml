[project]
name = "supportdesk"
version = "0.1.0"
description = "SupportDesk customer support agent on AWS (local Python code and tests)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "strands-agents>=1.0",
    "bedrock-agentcore>=1.0",
    # strands-agents caps mcp below 2.2; 2.1.1 has CVE-2026-59951 (fixed in 1.30.0 and 2.2.0).
    "mcp>=1.30,<2",
    "botocore[crt]>=1.43.118",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "moto[dynamodb]>=5.0",
]
infra = [
    "aws-cdk-lib>=2.200.0",
    "constructs>=10.4.0",
]

[tool.uv]
default-groups = ["dev", "infra"]

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["lambdas/orders", "lambdas/chat", "app/supportdesk", "infra", "scripts"]
extend-exclude = ["agentcore/cdk", "web", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["lambdas/orders", "lambdas/chat", "app/supportdesk", "infra", "scripts"]
testpaths = ["tests"]
